name: Verify netctl context stage

on:
  pull_request:
    paths:
      - "netctl/**"
      - "tests/**"
      - "requirements.txt"
      - "docs/verification/netctl-context-validate-status.md"
      - ".github/workflows/verify-netctl-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Run context-stage tests
        run: python -m pytest -q tests/test_netctl_context.py

  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare trusted system Python for controller process tests
        run: bash .github/scripts/prepare-controller-test-python.sh

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Install controller-compatible Ansible runtime
        run: python -m pip install --quiet ansible-core==2.18.6

      - name: Verify owned child-process fixtures before the full suite
        run: >-
          python -m pytest -q
          tests/alt_linux/test_krfb_managed_runtime.py
          tests/alt_linux/test_kwallet_empty_name_repair.py
          -k 'real_unprivileged_writer or durably_acknowledged or real_owned_writer or root_coordinator_orders'

      - name: Run full regression suite
        id: full_pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --maxfail=20 > pytest-full.log 2>&1
          rc=$?
          echo "$rc" > pytest-full.exit-code
          cat pytest-full.log
          exit "$rc"

      - name: Upload full regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-regression
          path: |
            pytest-full.log
            pytest-full.exit-code
          if-no-files-found: error
          retention-days: 7
