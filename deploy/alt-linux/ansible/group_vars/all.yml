---
ansible_python_interpreter: /usr/bin/python3
preflight_min_home_bytes: 2147483648
# Keep the approved Plasma X11 session for the manual domain-workstation flow.
workstation_desktop_session: x11
ad_dns_servers:
  - 192.168.100.11
ad_ldap_uri: ldap://ad-main.sosnadmin.local
ad_domain: sosnadmin.local
ad_realm: SOSNADMIN.LOCAL
domain_prerequisite_packages:
  - task-auth-ad-sssd
  - openldap-clients
prejoin_upgrade_enabled: true
prejoin_upgrade_reboot_timeout: 900
# Attempts include the first invocation; Ansible retries are attempts minus one.
alt_transient_retry_attempts: 4
alt_transient_retry_delay: 5
alt_service_retry_attempts: 12
alt_service_retry_delay: 5
alt_ntp_retry_attempts: 24
alt_ntp_retry_delay: 5
alt_package_lock_retry_attempts: 24
alt_package_lock_retry_delay: 5
alt_domain_join_max_attempts: 2
# Deliberately narrow allowlists; unknown failures stop immediately.
alt_package_lock_pattern: '(?i)(could not get lock|unable to acquire.*lock|another process.*(apt|rpm)|resource temporarily unavailable.*lock)'
alt_package_transient_pattern: '(?i)(temporary failure resolving|could not resolve|connection timed out|connection refused|could not connect|network is unreachable)'
alt_package_fatal_pattern: '(?i)(signature|checksum|hash sum mismatch|unmet dependencies|dependency problems|broken packages|no_pubkey)'
alt_domain_transient_pattern: "(?i)(cannot contact any KDC|cannot find KDC|can.t contact LDAP server|connection timed out|connection refused|network is unreachable|temporary failure in name resolution)"
alt_group_policy_transient_pattern: "(?i)(cannot contact any KDC|can.t contact LDAP server|connection timed out|connection refused|network is unreachable|temporary failure in name resolution)"
alt_group_policy_fatal_pattern: '(?i)(access denied|permission denied|invalid credentials|preauthentication failed|insufficient access)'
alt_group_policy_prerequisite_packages:
  - gpupdate
  - alterator-gpupdate
standard_packages: []
organization_packages: []
approved_software_components:
  - browser
endpoint_enrollment_campaign_id: null
remote_access_profile: none
assigned_domain_user: null
software_catalog:
  endpoint_agent:
    artifact_path: /opt/alt-deploy-control/artifacts/endpoint-agent/endpoint-agent-0.1.0-6.x86_64.rpm
    sha256: c7e3a1476ae831611cfb593f34ac4b7c43ff6c6602a6d7717c2032049cb752ac
    package_name: endpoint-agent
    package_evr: 0.1.0-6
    architecture: x86_64
