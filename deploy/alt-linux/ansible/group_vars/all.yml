---
ansible_python_interpreter: /usr/bin/python3
preflight_min_home_bytes: 2147483648
# Use vendor-supported Plasma Wayland for new LightDM logins.
workstation_desktop_session: wayland
ad_dns_servers:
  - 192.168.100.1
ad_ldap_uri: ldap://ad-main.sosnadmin.local
ad_domain: sosnadmin.local
ad_realm: SOSNADMIN.LOCAL
domain_prerequisite_packages:
  - task-auth-ad-sssd
  - openldap-clients
prejoin_upgrade_enabled: true
prejoin_upgrade_reboot_timeout: 900
alt_transient_attempts: 4
alt_transient_delay_seconds: 5
alt_package_lock_attempts: 24
alt_package_lock_delay_seconds: 5
# Retry only package-manager locks and transient transport/mirror failures.
# Signature, checksum, architecture and dependency-policy errors are fatal.
alt_apt_transient_error_pattern: >-
  could not get lock|temporary failure|network is unreachable|connection timed out|
  failed to fetch|mirror|could not resolve|name or service not known
# KDC and LDAP transport convergence only; rejected credentials never match.
alt_domain_transient_error_pattern: >-
  cannot contact any kdc|cannot resolve network address|can't contact ldap server|
  server is unavailable|connection timed out|network is unreachable|temporary failure|
  name or service not known|no route to host
alt_service_attempts: 12
alt_service_delay_seconds: 5
alt_ntp_attempts: 24
alt_ntp_delay_seconds: 5
alt_domain_join_max_attempts: 2
alt_group_policy_prerequisite_packages:
  - gpupdate
  - alterator-gpupdate
standard_packages: []
organization_packages: []
approved_software_components:
  - browser
  - onlyoffice
  - nextcloud_desktop
  - desktop_shortcuts
# These values are used by both the system skeleton role and the post-login
# role.  Role defaults are not shared between separately invoked roles.
desktop_shortcuts_applications_dir: /usr/share/applications
desktop_shortcuts_application_entries:
  - yandex-browser.desktop
  - onlyoffice-desktopeditors.desktop
  - nextcloud-client.desktop
desktop_shortcuts_nextcloud_entry: nextcloud-client.desktop
desktop_shortcuts_custom_entries:
  - sosn-cryptopro.desktop
  - sosn-home.desktop
  - sosn-public.desktop
organization_ca_artifact_path: /opt/alt-deploy-control/artifacts/organization-ca/sosnadmin-local-ca.crt
organization_ca_artifact_sha256: b9cef2205fe10e4a2a2b00852348f6cbbbcfa3b18db1588d093a407bee91029f
organization_ca_anchor_path: /etc/pki/ca-trust/source/anchors/sosnadmin-local-ca.crt
organization_ca_subject: Sosnadmin Local CA
endpoint_agent_rpm_source: /opt/alt-deploy-control/artifacts/endpoint-agent/endpoint-agent-3.2.21-alt2.x86_64.rpm
endpoint_agent_rpm_sha256: 44ef9157f6f88049b715e957d4c0cc8e1b5f5e1ae109e9a0442045de91580d05
endpoint_agent_ca_source: /opt/alt-deploy-control/artifacts/organization-ca/sosnadmin-local-ca.crt
endpoint_agent_gateway_ca_path: /opt/alt-deploy-control/artifacts/organization-ca/sosnadmin-local-ca.crt
endpoint_agent_installation_id: "endpoint-{{ machine_uuid }}"
endpoint_agent_campaign_cidrs:
  - 192.168.100.0/23
  - 192.168.101.0/24
endpoint_agent_campaign_lifetime_minutes: 15
endpoint_agent_campaign_policy:
  policy_id: ansible-alt-rollout
endpoint_agent_campaign_label: Ansible ALT rollout
endpoint_agent_campaign_site: sosnadmin
endpoint_agent_enrollment_retries: 30
endpoint_agent_enrollment_delay_seconds: 2
software_catalog:
  cryptopro:
