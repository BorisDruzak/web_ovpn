---
ansible_python_interpreter: /usr/bin/python3
preflight_min_home_bytes: 2147483648
# UPN login is compatible with Plasma X11 on ALT Workstation K 11.x.
# Keep Wayland installed for a later vendor-compatible switch.
workstation_desktop_session: x11
ad_dns_servers:
  - 192.168.100.11
ad_ldap_uri: ldap://ad-main.sosnadmin.local
ad_domain: sosnadmin.local
ad_realm: SOSNADMIN.LOCAL
domain_prerequisite_packages:
  - task-auth-ad-sssd
  - openldap-clients
prejoin_upgrade_enabled: true
prejoin_upgrade_reboot_timeout: 900
alt_group_policy_prerequisite_packages:
  - gpupdate
standard_packages: []
organization_packages: []
