---
- name: Configure manual ALT domain workstation
  hosts: all
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml
  roles:
    - manual_preflight
    - workstation_identity
    - prejoin_upgrade
    - workstation_base
    - alt_group_policy_prerequisites
    - workstation_network
    - domain_join
    - alt_group_policy_client
    - standard_software
    - domain_verify
