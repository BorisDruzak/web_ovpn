---
- name: Initialize structured configure result
  ansible.builtin.set_fact:
    configure_result:
      schema_version: 1
      machine_uuid: "{{ machine_uuid }}"
      hostname: "{{ final_hostname }}"
      profile: "{{ profile }}"
      status: successful
      phase: finalize
      retryable: false
      recovered: false
      reboot_required: false
      error: null
      components: {}
      verification: {}

- name: Configure critical workstation roles
  block:
    - name: Set configure phase to preflight
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'preflight'}) }}"

    - name: Run component catalog preflight
      ansible.builtin.include_tasks: configure_component_preflight.yml

    - name: Require the original managed system phase for the complete preset
      ansible.builtin.assert:
        that:
          - software_profile == 'workstation-full-v1'
          - alt_setup_workflow_context is defined and alt_setup_workflow_context is mapping
          - alt_setup_workflow_context.schema_version == 1
          - alt_setup_workflow_context.kind == 'complete_workstation'
          - alt_setup_workflow_context.phase == 'system'
          - alt_setup_workflow_context.machine_uuid == machine_uuid
          - alt_setup_workflow is defined
          - alt_setup_workflow == (approved_software_catalog | alt_setup_workflow(alt_setup_workflow))
          - alt_setup_workflow_context.workflow_policy_sha256 == alt_setup_workflow.policy_sha256
          - alt_setup_workflow_context.policy_sha256 == (alt_setup_workflow.policy.vnc | to_json(sort_keys=True, separators=(',', ':')) | hash('sha256'))
          - remote_access_profile == 'krfb'
        fail_msg: The complete preset requires its original native system claim
      when: software_profile == 'workstation-full-v1' or alt_setup_workflow_context is defined
      no_log: true

    - name: Run manual preflight
      ansible.builtin.include_role:
        name: manual_preflight
        apply:
          tags: [alt_setup_preflight]

    - name: Set configure phase to identity
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'identity'}) }}"

    - name: Run workstation identity
      ansible.builtin.include_role:
        name: workstation_identity
        apply:
          tags: [alt_setup_identity]

    - name: Prepare direct authenticated VNC policy before upgrade or join
      ansible.builtin.include_role:
        name: remote_access_policy
      when: software_profile == 'workstation-full-v1'

    - name: Set configure phase to upgrade
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'upgrade'}) }}"

    - name: Run prejoin upgrade
      ansible.builtin.include_role:
        name: prejoin_upgrade
        apply:
          tags: [alt_setup_upgrade]

    - name: Install KRFB only for the later genuine user phase
      ansible.builtin.include_role:
        name: remote_access_krfb
        tasks_from: system
      when: software_profile == 'workstation-full-v1'

    - name: Run workstation base
      ansible.builtin.include_role:
        name: workstation_base

    - name: Set configure phase to network prerequisites
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'network'}) }}"

    - name: Run group policy prerequisites
      ansible.builtin.include_role:
        name: alt_group_policy_prerequisites
        apply:
          tags: [alt_setup_network]

    - name: Run workstation network
      ansible.builtin.include_role:
        name: workstation_network
        apply:
          tags: [alt_setup_network]

    - name: Set configure phase to domain join
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'domain_join'}) }}"

    - name: Run domain join
      ansible.builtin.include_role:
        name: domain_join
        apply:
          tags: [alt_setup_domain_join]

    - name: Set configure phase to domain core verification
      ansible.builtin.set_fact:
        configure_result: "{{ configure_result | combine({'phase': 'domain_core_verify'}) }}"

    - name: Run group policy client
      ansible.builtin.include_role:
        name: alt_group_policy_client
        apply:
          tags: [alt_setup_domain_core_verify]

    - name: Run domain login baseline
      ansible.builtin.include_role:
        name: domain_login_baseline
        apply:
          tags: [alt_setup_configuration]

    - name: Run Plasma baseline for future and existing domain profiles
      ansible.builtin.include_role:
        name: plasma_baseline

    - name: Run selected standard software
      ansible.builtin.include_role:
        name: standard_software

    - name: Install approved government certificate authorities
      ansible.builtin.include_role:
        name: government_ca

    - name: Configure application shortcuts after the selected applications
      ansible.builtin.include_role:
        name: desktop_shortcuts
      when: "software_profile != 'workstation-full-v1' and 'desktop.shortcuts' in (setup_selected_catalog.execution_components | map(attribute='id') | list)"

    - name: Run requested KRFB profile
      ansible.builtin.include_role:
        name: remote_access_krfb
      when: remote_access_profile == 'krfb' and software_profile != 'workstation-full-v1'

    - name: Run domain verification
      ansible.builtin.include_role:
        name: domain_verify
        apply:
          tags: [alt_setup_verify]

    - name: Finalize successful configure result
      ansible.builtin.set_fact:
        configure_result: >-
          {{ configure_result | combine({
            'status': 'successful',
            'phase': 'finalize',
            'retryable': false,
            'recovered': domain_join_recovered | default(false) | bool,
            'reboot_required': (prejoin_upgrade_reboot_required | default(false) | bool)
              or (domain_join_reboot_required | default(false) | bool),
            'error': none,
            'components': configure_result.components | combine({
              'manual_preflight': true,
              'workstation_identity': true,
              'prejoin_upgrade': true,
              'workstation_base': true,
              'alt_group_policy_prerequisites': true,
              'workstation_network': true,
              'domain_join': true,
              'alt_group_policy_client': true,
              'domain_login_baseline': true,
              'plasma_baseline': true,
              'government_ca': true,
              'domain_verify': true
            }),
            'verification': configure_result.verification | combine(domain_verification | default({})) | combine({
              'group_policy': alt_group_policy_machine_updated | default(false) | bool
            })
          }) }}

    - name: Record explicitly deferred complete-workstation phases
      ansible.builtin.set_fact:
        configure_result: >-
          {{ configure_result | combine({'components': configure_result.components | combine({
            'workflow_deferred': {'schema_version': 1, 'status': 'deferred',
              'user': alt_setup_workflow.phases[1].component_ids,
              'final_dns': alt_setup_workflow.phases[2].component_ids}
          })}) }}
      when: software_profile == 'workstation-full-v1'

    - name: Persist successful configure result
      ansible.builtin.include_tasks: write_configure_result.yml

  rescue:
    - name: Build failed configure result
      ansible.builtin.set_fact:
        configure_result: >-
          {{ configure_result | combine({
            'status': 'failed',
            'retryable': false,
            'recovered': domain_join_recovered | default(false) | bool,
            'reboot_required': (prejoin_upgrade_reboot_required | default(false) | bool)
              or (domain_join_reboot_required | default(false) | bool),
            'verification': configure_result.verification | combine(domain_verification | default({})) | combine({
              'group_policy': alt_group_policy_machine_updated | default(false) | bool
            }),
            'error': {
              'code': 'configure_critical_phase_failed',
              'class': 'fatal-invariant',
              'safe_message': 'Critical phase configuration failed'
            }
          }) }}

    - name: Persist failed configure result
      ansible.builtin.include_tasks: write_configure_result.yml

    - name: Fail critical workstation configuration
      ansible.builtin.fail:
        msg: Critical workstation configuration failed
