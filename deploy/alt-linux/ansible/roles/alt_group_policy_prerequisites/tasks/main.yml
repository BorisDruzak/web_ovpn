---
- name: Install the ALT Group Policy client before domain join
  ansible.builtin.package:
    name: "{{ alt_group_policy_prerequisite_packages }}"
    state: present
  environment:
    LC_ALL: C
  register: alt_group_policy_packages
  vars:
    alt_package_retry_output: >-
      {{ [alt_group_policy_packages.stdout | default(''), alt_group_policy_packages.stderr | default(''), alt_group_policy_packages.msg | default('')] | join('\n') }}
  until: >-
    alt_group_policy_packages is succeeded or
    alt_package_retry_output | regex_search(alt_package_fatal_pattern) is not none or
    (alt_package_retry_output | regex_search(alt_package_lock_pattern) is none and
      (alt_package_retry_output | regex_search(alt_package_transient_pattern) is none or
       alt_group_policy_packages.attempts | int >= alt_transient_retry_attempts | int))
  retries: "{{ alt_package_lock_retry_attempts | int - 1 }}"
  delay: "{{ alt_package_lock_retry_delay }}"
  when: alt_group_policy_prerequisite_packages | length > 0
