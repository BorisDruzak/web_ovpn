---
- name: Select launchers from the published profile and verified component dependencies
  ansible.builtin.set_fact:
    desktop_shortcuts_selected_entries: >-
      {{ desktop_shortcuts_component_entries | dict2items |
         selectattr('key', 'in', setup_selected_catalog.profile_component_ids) |
         map(attribute='value') | list }}

- name: Verify desktop launcher policy ownership
  ansible.builtin.script: >-
    {{ role_path }}/files/desktop_policy_source.py
    --user {{ assigned_domain_user | default(domain_test_user, true) | quote }}
    --entries-json {{ desktop_shortcuts_selected_entries | to_json | quote }}
    --desktop-name {{ desktop_shortcuts_user_desktop_name | quote }}
  args:
    executable: /usr/bin/python3
  register: desktop_shortcuts_policy_check
  changed_when: false
  check_mode: false
  no_log: true

- name: Record verified desktop launcher policy ownership
  ansible.builtin.set_fact:
    desktop_shortcuts_policy_source: "{{ desktop_shortcuts_policy_check.stdout | from_json }}"
  no_log: true

- name: Inspect the GPO verifier helper parent
  ansible.builtin.stat:
    path: /usr/local/libexec
    follow: false
  register: desktop_shortcuts_helper_parent
  when: desktop_shortcuts_policy_source.source == 'gpo'

- name: Require a protected existing helper parent
  ansible.builtin.assert:
    that:
      - not desktop_shortcuts_helper_parent.stat.exists or desktop_shortcuts_helper_parent.stat.isdir
      - not desktop_shortcuts_helper_parent.stat.exists or not desktop_shortcuts_helper_parent.stat.islnk
      - not desktop_shortcuts_helper_parent.stat.exists or desktop_shortcuts_helper_parent.stat.uid == 0
      - not desktop_shortcuts_helper_parent.stat.exists or desktop_shortcuts_helper_parent.stat.mode == '0755'
    fail_msg: ALT_PREFLIGHT_FAILURE:desktop_gpo_helper_parent_unsafe
  when: desktop_shortcuts_policy_source.source == 'gpo'

- name: Create the GPO verifier helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: desktop_shortcuts_policy_source.source == 'gpo'

- name: Install the read-only desktop GPO verifier
  ansible.builtin.copy:
    src: "{{ role_path }}/files/desktop_policy_source.py"
    dest: /usr/local/libexec/alt-desktop-gpo-verify.py
    owner: root
    group: root
    mode: "0755"
  when: desktop_shortcuts_policy_source.source == 'gpo'

- name: Create desktop directory for future domain users
  ansible.builtin.file:
    path: "{{ desktop_shortcuts_skel_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: desktop_shortcuts_policy_source.source == 'ansible'

- name: Inspect installed desktop application entries
  ansible.builtin.stat:
    path: "{{ desktop_shortcuts_applications_dir }}/{{ item }}"
  loop: "{{ desktop_shortcuts_selected_entries }}"
  register: desktop_shortcuts_application_entry_stats

- name: Require installed desktop application entries
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "ALT_PREFLIGHT_FAILURE:desktop_shortcut_application_missing"
  loop: "{{ desktop_shortcuts_application_entry_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Copy application launchers into future domain user desktops
  ansible.builtin.copy:
    src: "{{ desktop_shortcuts_applications_dir }}/{{ item }}"
    dest: "{{ desktop_shortcuts_skel_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop: "{{ desktop_shortcuts_selected_entries }}"
  when: desktop_shortcuts_policy_source.source == 'ansible'

- name: Create folder links in future domain user desktops
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ desktop_shortcuts_skel_dir }}/{{ item.name }}"
    state: link
    force: true
  loop: "{{ desktop_shortcuts_relative_links }}"
  when: desktop_shortcuts_policy_source.source == 'ansible'

- name: Create Nextcloud autostart directory for future domain users
  ansible.builtin.file:
    path: "{{ desktop_shortcuts_nextcloud_autostart_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: desktop_shortcuts_policy_source.source == 'ansible'

- name: Add Nextcloud to future domain user autostart
  ansible.builtin.copy:
    src: "{{ desktop_shortcuts_applications_dir }}/{{ desktop_shortcuts_nextcloud_entry }}"
    dest: "{{ desktop_shortcuts_nextcloud_autostart_dir }}/{{ desktop_shortcuts_nextcloud_entry }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: desktop_shortcuts_policy_source.source == 'ansible'

- name: Resolve domain test user for existing desktop shortcuts
  ansible.builtin.command:
    argv: [getent, -s, sss, passwd, "{{ assigned_domain_user | default(domain_test_user, true) }}"]
  register: desktop_shortcuts_user_lookup
  changed_when: false
  failed_when: false
  no_log: true

- name: Parse existing domain test user identity
  ansible.builtin.set_fact:
    desktop_shortcuts_user_fields: "{{ desktop_shortcuts_user_lookup.stdout | trim | split(':') }}"
  when: desktop_shortcuts_user_lookup.rc == 0
  no_log: true

- name: Validate the selected domain profile identity before home operations
  ansible.builtin.assert:
    that:
      - desktop_shortcuts_user_fields | length == 7
      - desktop_shortcuts_user_fields[2] | int > 0
      - desktop_shortcuts_user_fields[3] | int > 0
      - desktop_shortcuts_user_fields[5] is match('^/home/[^/]+(?:/[^/]+)?$')
      - desktop_shortcuts_user_fields[0] | lower in [(assigned_domain_user | default(domain_test_user, true) | lower), (assigned_domain_user | default(domain_test_user, true) | lower).split('@')[0]]
    fail_msg: ALT_PREFLIGHT_FAILURE:desktop_profile_identity_invalid
  when: desktop_shortcuts_user_lookup.rc == 0
  no_log: true

- name: Inspect existing domain test user home
  ansible.builtin.stat:
    path: "{{ desktop_shortcuts_user_fields[5] }}"
    follow: false
  register: desktop_shortcuts_user_home
  when:
    - desktop_shortcuts_user_lookup.rc == 0
    - desktop_shortcuts_user_fields | length == 7
  no_log: true

- name: Validate existing home ownership without following a symlink
  ansible.builtin.assert:
    that:
      - desktop_shortcuts_user_home.stat.isdir
      - not desktop_shortcuts_user_home.stat.islnk
      - desktop_shortcuts_user_home.stat.uid == desktop_shortcuts_user_fields[2] | int
    fail_msg: ALT_PREFLIGHT_FAILURE:desktop_profile_home_unsafe
  when:
    - desktop_shortcuts_user_home.stat.exists | default(false)
  no_log: true

- name: Inspect the domain home parents without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ ['/home', desktop_shortcuts_user_fields[5] | dirname] }}"
  register: desktop_shortcuts_home_parents
  when: desktop_shortcuts_user_home.stat.exists | default(false)
  no_log: true

- name: Require actual root-owned domain home parents
  ansible.builtin.assert:
    that:
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == 0
    fail_msg: ALT_PREFLIGHT_FAILURE:desktop_profile_parent_unsafe
  loop: "{{ desktop_shortcuts_home_parents.results | default([]) }}"
  when: not item.skipped | default(false)
  no_log: true

- name: Inspect existing profile destinations before the first home write
  ansible.builtin.stat:
    path: "{{ desktop_shortcuts_user_fields[5] }}/{{ item }}"
    follow: false
  loop: "{{ [desktop_shortcuts_user_desktop_name, '.config', '.config/autostart', '.config/autostart/' ~ desktop_shortcuts_nextcloud_entry] + desktop_shortcuts_selected_entries | map('regex_replace', '^', desktop_shortcuts_user_desktop_name ~ '/') | list }}"
  register: desktop_shortcuts_profile_destinations
  when: desktop_shortcuts_user_home.stat.exists | default(false)
  no_log: true

- name: Refuse symlinked or foreign-owned profile destinations
  ansible.builtin.assert:
    that:
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.uid == desktop_shortcuts_user_fields[2] | int
    fail_msg: ALT_PREFLIGHT_FAILURE:desktop_profile_destination_unsafe
  loop: "{{ desktop_shortcuts_profile_destinations.results | default([]) }}"
  when:
    - not item.skipped | default(false)
  no_log: true

- name: Create existing domain test user desktop directory
  ansible.builtin.file:
    path: "{{ desktop_shortcuts_user_fields[5] }}/{{ desktop_shortcuts_user_desktop_name }}"
    state: directory
    owner: "{{ desktop_shortcuts_user_fields[2] | int }}"
    group: "{{ desktop_shortcuts_user_fields[3] | int }}"
    mode: "0755"
  when:
    - desktop_shortcuts_policy_source.source == 'ansible'
    - desktop_shortcuts_user_home is defined
    - desktop_shortcuts_user_home.stat.exists
  no_log: true

- name: Copy application launchers into existing domain test user desktop
  ansible.builtin.copy:
    src: "{{ desktop_shortcuts_applications_dir }}/{{ item }}"
    dest: "{{ desktop_shortcuts_user_fields[5] }}/{{ desktop_shortcuts_user_desktop_name }}/{{ item }}"
    remote_src: true
    owner: "{{ desktop_shortcuts_user_fields[2] | int }}"
    group: "{{ desktop_shortcuts_user_fields[3] | int }}"
    mode: "0755"
  loop: "{{ desktop_shortcuts_selected_entries }}"
  when:
    - desktop_shortcuts_policy_source.source == 'ansible'
    - desktop_shortcuts_user_home is defined
    - desktop_shortcuts_user_home.stat.exists
  no_log: true

- name: Create Nextcloud autostart directory for existing domain test user
  ansible.builtin.file:
    path: "{{ desktop_shortcuts_user_fields[5] }}/.config/autostart"
    state: directory
    owner: "{{ desktop_shortcuts_user_fields[2] | int }}"
    group: "{{ desktop_shortcuts_user_fields[3] | int }}"
    mode: "0700"
  when:
    - desktop_shortcuts_policy_source.source == 'ansible'
    - desktop_shortcuts_user_home is defined
    - desktop_shortcuts_user_home.stat.exists
  no_log: true

- name: Add Nextcloud to existing domain test user autostart
  ansible.builtin.copy:
    src: "{{ desktop_shortcuts_applications_dir }}/{{ desktop_shortcuts_nextcloud_entry }}"
    dest: "{{ desktop_shortcuts_user_fields[5] }}/.config/autostart/{{ desktop_shortcuts_nextcloud_entry }}"
    remote_src: true
    owner: "{{ desktop_shortcuts_user_fields[2] | int }}"
    group: "{{ desktop_shortcuts_user_fields[3] | int }}"
    mode: "0644"
  when:
    - desktop_shortcuts_policy_source.source == 'ansible'
    - desktop_shortcuts_user_home is defined
    - desktop_shortcuts_user_home.stat.exists
  no_log: true

- name: Create folder links in existing domain test user desktop
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ desktop_shortcuts_user_fields[5] }}/{{ desktop_shortcuts_user_desktop_name }}/{{ item.name }}"
    state: link
    force: true
    follow: false
    owner: "{{ desktop_shortcuts_user_fields[2] | int }}"
    group: "{{ desktop_shortcuts_user_fields[3] | int }}"
  loop: "{{ desktop_shortcuts_relative_links }}"
  when:
    - desktop_shortcuts_policy_source.source == 'ansible'
    - desktop_shortcuts_user_home is defined
    - desktop_shortcuts_user_home.stat.exists
  no_log: true

- name: Configure optional personal network folders after application shortcuts
  ansible.builtin.include_tasks: network_folders.yml

- name: Verify GPO-owned launchers after role execution
  ansible.builtin.script: >-
    {{ role_path }}/files/desktop_policy_source.py
    --user {{ assigned_domain_user | default(domain_test_user, true) | quote }}
    --entries-json {{ desktop_shortcuts_selected_entries | to_json | quote }}
    --desktop-name {{ desktop_shortcuts_user_desktop_name | quote }}
  args:
    executable: /usr/bin/python3
  changed_when: false
  check_mode: false
  when: desktop_shortcuts_policy_source.source == 'gpo'
  no_log: true

- name: Record verified shortcuts and home-dependent deferral
  ansible.builtin.set_fact:
    desktop_shortcuts_verified: true
    desktop_shortcuts_home_deferred: "{{ not (desktop_shortcuts_user_home.stat.exists | default(false)) }}"
    configure_result: >-
      {{ configure_result | default({'components': {}, 'verification': {}}) | combine({
        'components': (configure_result | default({})).get('components', {}) | combine({
          'desktop_shortcuts': {'status': 'ok', 'verified': true,
            'policy_source': desktop_shortcuts_policy_source.source,
            'home_deferred': not (desktop_shortcuts_user_home.stat.exists | default(false)),
            'network_folders': desktop_network_folders_result}
        }),
        'verification': (configure_result | default({})).get('verification', {}) | combine({'desktop_shortcuts': true})
      }) }}
