---
- name: Read current ALT authentication scheme
  ansible.builtin.command:
    argv: [system-auth, status]
  register: domain_join_status
  changed_when: false
  failed_when: false

- name: Reject a different Active Directory domain
  ansible.builtin.assert:
    that: >-
      (domain_join_status.stdout | trim | lower is not match('^ad\\s+'))
      or (ad_domain in (domain_join_status.stdout | lower))
    fail_msg: ALT_PREFLIGHT_FAILURE:domain_conflict workstation belongs to another domain

- name: Verify existing Samba domain trust
  ansible.builtin.command:
    argv: [net, ads, testjoin]
  register: domain_join_testjoin
  changed_when: false
  failed_when: false

- name: Determine whether the requested domain is already joined
  ansible.builtin.set_fact:
    # The preceding domain-conflict assertion already binds system-auth to
    # ad_domain. net ads testjoin is the authoritative trust check and avoids
    # reparing a valid machine account on an idempotent rerun.
    domain_join_already_joined: "{{ domain_join_testjoin.rc == 0 }}"

- name: Convert computer OU DN to ALT parent-first createcomputer path
  ansible.builtin.set_fact:
    alt_createcomputer_path: >-
      {{ computer_ou | regex_replace(',DC=sosnadmin,DC=local$', '')
         | regex_findall('OU=([^,]+)') | reverse | join('/') }}

- name: Join workstation to Active Directory with Kerberos credentials
  no_log: true
  when: not domain_join_already_joined
  block:
    - name: Acquire temporary Kerberos ticket
      ansible.builtin.command:
        argv: [kinit, -C, "{{ vault_ad_join_user }}"]
        stdin: "{{ vault_ad_join_password }}"
      register: domain_join_kinit
      changed_when: false
      failed_when: >-
        domain_join_kinit.rc != 0 and
        not (
          ((domain_join_kinit.stdout | default('')) ~ '\n' ~
           (domain_join_kinit.stderr | default(''))) | lower
          is search(alt_domain_transient_error_pattern)
        )
      retries: "{{ alt_transient_attempts }}"
      delay: "{{ alt_transient_delay_seconds }}"
      until: domain_join_kinit.rc == 0

    - name: Search target OU for requested computer account
      ansible.builtin.command:
        argv:
          - ldapsearch
          - -LLL
          - -Y
          - GSSAPI
          - -H
          - "{{ ad_ldap_uri }}"
          - -b
          - "{{ computer_ou }}"
          - -s
          - sub
          - "(sAMAccountName={{ final_hostname }}$)"
          - dn
      register: domain_join_computer_lookup
      changed_when: false
      failed_when: >-
        domain_join_computer_lookup.rc != 0 and
        not (
          ((domain_join_computer_lookup.stdout | default('')) ~ '\n' ~
           (domain_join_computer_lookup.stderr | default(''))) | lower
          is search(alt_domain_transient_error_pattern)
        )
      retries: "{{ alt_transient_attempts }}"
      delay: "{{ alt_transient_delay_seconds }}"
      until: domain_join_computer_lookup.rc == 0

    - name: Determine whether requested computer account already exists
      ansible.builtin.set_fact:
        domain_join_computer_exists: >-
          {{ domain_join_computer_lookup.stdout is search('(?m)^dn: ') }}

    - name: Reject an untrusted existing computer account
      ansible.builtin.assert:
        that: not domain_join_computer_exists
        fail_msg: ALT_PREFLIGHT_FAILURE:domain_computer_conflict requested computer account already exists

    - name: Join workstation and prove resulting domain trust
      block:
        - name: Join workstation through ALT system-auth
          ansible.builtin.command:
            argv:
              - system-auth
              - write
              - ad
              - "{{ ad_domain }}"
              - "{{ final_hostname }}"
              - "{{ workgroup }}"
              - "{{ vault_ad_join_user }}"
              - "--createcomputer={{ alt_createcomputer_path }}"
              - "--gpo"
          register: domain_join_command
          changed_when: true

        - name: Verify resulting Samba domain trust
          ansible.builtin.command:
            argv: [net, ads, testjoin]
          register: domain_join_reconciled_trust
          changed_when: false

      rescue:
        - name: Reconcile domain trust after ambiguous join failure
          ansible.builtin.command:
            argv: [net, ads, testjoin]
          register: domain_join_reconciled_trust
          changed_when: false
          failed_when: false

        - name: Search target OU after ambiguous join failure
          ansible.builtin.command:
            argv:
              - ldapsearch
              - -LLL
              - -Y
              - GSSAPI
              - -H
              - "{{ ad_ldap_uri }}"
              - -b
              - "{{ computer_ou }}"
              - -s
              - sub
              - "(sAMAccountName={{ final_hostname }}$)"
              - dn
          register: domain_join_recovery_computer_lookup
          changed_when: false
          failed_when: >-
            domain_join_recovery_computer_lookup.rc != 0 and
            not (
              ((domain_join_recovery_computer_lookup.stdout | default('')) ~ '\n' ~
               (domain_join_recovery_computer_lookup.stderr | default(''))) | lower
              is search(alt_domain_transient_error_pattern)
            )
          retries: "{{ alt_transient_attempts }}"
          delay: "{{ alt_transient_delay_seconds }}"
          until: domain_join_recovery_computer_lookup.rc == 0
          when: domain_join_reconciled_trust.rc != 0

        - name: Determine whether computer account exists after ambiguous join failure
          ansible.builtin.set_fact:
            domain_join_recovery_computer_exists: >-
              {{ domain_join_recovery_computer_lookup.stdout is search('(?m)^dn: ') }}
          when: domain_join_reconciled_trust.rc != 0

        - name: Reject untrusted computer account after ambiguous join failure
          ansible.builtin.assert:
            that: not domain_join_recovery_computer_exists
            fail_msg: ALT_PREFLIGHT_FAILURE:domain_computer_conflict requested computer account already exists
          when: domain_join_reconciled_trust.rc != 0

        - name: Retry join only when mutation is proven absent
          ansible.builtin.command:
            argv:
              - system-auth
              - write
              - ad
              - "{{ ad_domain }}"
              - "{{ final_hostname }}"
              - "{{ workgroup }}"
              - "{{ vault_ad_join_user }}"
              - "--createcomputer={{ alt_createcomputer_path }}"
              - "--gpo"
          register: domain_join_recovery_command
          changed_when: true
          when:
            - domain_join_reconciled_trust.rc != 0
            - not domain_join_recovery_computer_exists

        - name: Verify trust after safe join retry
          ansible.builtin.command:
            argv: [net, ads, testjoin]
          register: domain_join_reconciled_trust
          changed_when: false
          when: domain_join_reconciled_trust.rc != 0

        - name: Require trusted domain join after reconciliation
          ansible.builtin.assert:
            that: domain_join_reconciled_trust.rc == 0
            fail_msg: >-
              ALT_PREFLIGHT_FAILURE:domain_join_outcome_unknown
              Domain join outcome cannot be verified safely

        - name: Mark reconciled domain join as recovered
          ansible.builtin.set_fact:
            domain_join_recovered: true
  always:
    - name: Destroy temporary Kerberos ticket
      ansible.builtin.command:
        argv: [kdestroy]
      changed_when: false
      failed_when: false
