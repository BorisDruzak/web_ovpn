---
- name: Verify ALT domain membership
  ansible.builtin.command:
    argv: [net, ads, testjoin]
  register: domain_verify_join
  changed_when: false
  retries: "{{ alt_service_attempts }}"
  delay: "{{ alt_service_delay_seconds }}"
  until: domain_verify_join.rc == 0

- name: Verify SSSD service
  ansible.builtin.command:
    argv: [systemctl, is-active, sssd]
  register: domain_verify_sssd
  changed_when: false
  retries: "{{ alt_service_attempts }}"
  delay: "{{ alt_service_delay_seconds }}"
  until: domain_verify_sssd.stdout | trim == 'active'

- name: Verify domain user lookup
  ansible.builtin.command:
    argv: [getent, passwd, "{{ domain_test_user if '@' in domain_test_user else domain_test_user ~ '@' ~ ad_domain }}"]
  register: domain_verify_user
  changed_when: false
  retries: "{{ alt_service_attempts }}"
  delay: "{{ alt_service_delay_seconds }}"
  until: domain_verify_user.rc == 0

- name: Validate domain verification result
  ansible.builtin.assert:
    that:
      - domain_verify_join.rc == 0
      - domain_verify_sssd.stdout | trim == 'active'
      - domain_verify_user.rc == 0
    fail_msg: ALT_PREFLIGHT_FAILURE:domain_verification_failed domain verification failed

- name: Publish domain core verification facts
  ansible.builtin.set_fact:
    configure_domain_core_verified: true
