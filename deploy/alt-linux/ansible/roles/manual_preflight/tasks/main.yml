---
- name: Read ALT operating system metadata
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - '. /etc/os-release && printf "%s\\n%s\\n" "$NAME" "$VERSION_ID"'
  register: manual_preflight_os_release
  changed_when: false

- name: Validate ALT Workstation K 11.x release
  ansible.builtin.assert:
    that:
      - manual_preflight_os_release.stdout_lines | length == 2
      - manual_preflight_os_release.stdout_lines[0] | trim == 'ALT Workstation K'
      - manual_preflight_os_release.stdout_lines[1] | trim is match('^11\.')
    fail_msg: ALT_PREFLIGHT_FAILURE:manual_preflight_failed unsupported ALT release

- name: Read target UUID
  ansible.builtin.slurp:
    src: /sys/class/dmi/id/product_uuid
  register: manual_preflight_uuid_raw

- name: Validate target UUID
  ansible.builtin.assert:
    that:
      - manual_preflight_uuid_raw.content | b64decode | trim | lower == machine_uuid | lower
    fail_msg: ALT_PREFLIGHT_FAILURE:manual_preflight_failed target UUID mismatch

- name: Verify ansible passwordless sudo
  ansible.builtin.command:
    argv: [sudo, -n, "true"]
  become: false
  changed_when: false

- name: Verify default route
  ansible.builtin.command:
    argv: [ip, route, show, default]
  register: manual_preflight_route
  changed_when: false

- name: Validate default route
  ansible.builtin.assert:
    that: manual_preflight_route.stdout | trim | length > 0
    fail_msg: ALT_PREFLIGHT_FAILURE:manual_preflight_failed default route missing

- name: Verify time synchronization
  ansible.builtin.command:
    argv: [timedatectl, show, -p, NTPSynchronized, --value]
  register: manual_preflight_ntp
  changed_when: false

- name: Validate time synchronization
  ansible.builtin.assert:
    that: manual_preflight_ntp.stdout | trim == 'yes'
    fail_msg: ALT_PREFLIGHT_FAILURE:domain_time_unhealthy NTP is not synchronized

- name: Verify AD LDAP SRV record
  ansible.builtin.command:
    argv: [dig, "@{{ ad_dns_servers[0] }}", "_ldap._tcp.{{ ad_domain }}", SRV, +short]
  register: manual_preflight_ldap_srv
  changed_when: false

- name: Verify AD Kerberos SRV record
  ansible.builtin.command:
    argv: [dig, "@{{ ad_dns_servers[0] }}", "_kerberos._tcp.{{ ad_domain }}", SRV, +short]
  register: manual_preflight_kerberos_srv
  changed_when: false

- name: Validate AD DNS
  ansible.builtin.assert:
    that:
      - manual_preflight_ldap_srv.stdout | trim | length > 0
      - manual_preflight_kerberos_srv.stdout | trim | length > 0
    fail_msg: ALT_PREFLIGHT_FAILURE:domain_dns_unhealthy AD DNS records are unavailable
