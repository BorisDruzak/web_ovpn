---
- name: Inspect approved Sosnadmin CA on controller
  ansible.builtin.stat:
    path: "{{ organization_ca_artifact_path }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: organization_ca_artifact

- name: Require approved Sosnadmin CA on controller
  ansible.builtin.assert:
    that:
      - organization_ca_artifact.stat.exists
      - organization_ca_artifact.stat.isreg
      - organization_ca_artifact.stat.checksum == organization_ca_artifact_sha256
    fail_msg: ALT_PREFLIGHT_FAILURE:organization_ca_artifact_invalid

- name: Install Sosnadmin CA anchor
  ansible.builtin.copy:
    src: "{{ organization_ca_artifact_path }}"
    dest: "{{ organization_ca_anchor_path }}"
    owner: root
    group: root
    mode: "0644"
  register: organization_ca_copy

- name: Refresh system certificate trust
  ansible.builtin.command:
    argv: [/bin/update-ca-trust]
  when: organization_ca_copy is changed
  changed_when: true

- name: Verify Sosnadmin CA in system trust
  ansible.builtin.command:
    argv: [trust, list, --filter, ca-anchors]
  register: organization_ca_trust
  changed_when: false

- name: Require Sosnadmin CA in system trust
  ansible.builtin.assert:
    that:
      - organization_ca_subject in organization_ca_trust.stdout
    fail_msg: ALT_PREFLIGHT_FAILURE:organization_ca_verification_failed

- name: Publish organization CA verification fact
  ansible.builtin.set_fact:
    organization_ca_ok: true
