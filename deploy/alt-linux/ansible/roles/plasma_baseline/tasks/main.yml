---
- name: Create Plasma defaults directory for future domain users
  ansible.builtin.file:
    path: "{{ plasma_baseline_skel_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set approved Plasma power defaults for future domain users
  ansible.builtin.template:
    src: powerdevilrc.j2
    dest: "{{ plasma_baseline_skel_config_dir }}/powerdevilrc"
    owner: root
    group: root
    mode: "0644"

- name: Set approved Plasma keyboard layout behavior for future domain users
  ansible.builtin.template:
    src: kxkbrc.j2
    dest: "{{ plasma_baseline_skel_config_dir }}/kxkbrc"
    owner: root
    group: root
    mode: "0644"

- name: Apply power settings to an existing domain profile without creating a home
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - '-'
      - "{{ assigned_domain_user | default(domain_test_user, true) }}"
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/apply_existing_power.py') }}"
  register: plasma_baseline_existing_power
  changed_when: (plasma_baseline_existing_power.stdout | from_json).changed | bool
  when: not ansible_check_mode
  no_log: true

- name: Merge approved desktop defaults for future domain users
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-', --skel, "{{ plasma_baseline_skel_config_dir }}"]
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/apply_desktop_defaults.py') }}"
  register: plasma_baseline_future_desktop
  changed_when: (plasma_baseline_future_desktop.stdout | from_json).changed | bool
  when: not ansible_check_mode

- name: Merge approved desktop defaults into the existing domain profile
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-', "{{ assigned_domain_user | default(domain_test_user, true) }}"]
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/apply_desktop_defaults.py') }}"
  register: plasma_baseline_existing_desktop
  changed_when: (plasma_baseline_existing_desktop.stdout | from_json).changed | bool
  when: not ansible_check_mode
  no_log: true

- name: Merge published keyboard defaults into the existing domain profile
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - '-'
      - --keyboard
      - "{{ assigned_domain_user | default(domain_test_user, true) }}"
      - "{{ lookup('ansible.builtin.file', role_path ~ '/templates/kxkbrc.j2') }}"
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/apply_desktop_defaults.py') }}"
  register: plasma_baseline_existing_keyboard
  changed_when: (plasma_baseline_existing_keyboard.stdout | from_json).changed | bool
  when: not ansible_check_mode
  no_log: true
