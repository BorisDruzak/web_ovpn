---
- name: Read current ALT authentication scheme before upgrade
  ansible.builtin.command:
    argv: [system-auth, status]
  register: prejoin_upgrade_auth_status
  changed_when: false
  failed_when: false

- name: Detect whether the workstation is already domain joined
  ansible.builtin.set_fact:
    prejoin_upgrade_already_joined: >-
      {{ prejoin_upgrade_auth_status.stdout | trim | lower is match('^ad\\s+') }}

- name: Refresh ALT package metadata before first domain join
  ansible.builtin.command:
    argv: [apt-get, update]
  register: prejoin_upgrade_apt_update
  changed_when: false
  failed_when: false
  retries: "{{ alt_transient_attempts }}"
  delay: "{{ alt_transient_delay_seconds }}"
  until: >-
    prejoin_upgrade_apt_update.rc == 0 or
    (
      ((prejoin_upgrade_apt_update.stdout | default('')) ~ '\n' ~
       (prejoin_upgrade_apt_update.stderr | default(''))) | lower
      is not search(alt_apt_transient_error_pattern)
    )
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Stop before domain join when package metadata refresh is not recoverable
  ansible.builtin.set_fact:
    configure_phase_failure:
      code: upgrade_metadata_failed
      class: fatal_invariant
      safe_message: ALT package metadata could not be refreshed before domain join
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_apt_update.rc != 0

- name: Fail non-transient package metadata refresh before domain join
  ansible.builtin.fail:
    msg: >-
      ALT_PREFLIGHT_FAILURE:upgrade_metadata_failed
      ALT package metadata could not be refreshed before domain join
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_apt_update.rc != 0

- name: Inspect the planned full ALT upgrade for diagnostics
  ansible.builtin.command:
    argv: [apt-get, -s, dist-upgrade]
  register: prejoin_upgrade_simulation
  changed_when: false
  failed_when: false
  retries: "{{ alt_transient_attempts }}"
  delay: "{{ alt_transient_delay_seconds }}"
  until: >-
    prejoin_upgrade_simulation.rc == 0 or
    (
      ((prejoin_upgrade_simulation.stdout | default('')) ~ '\n' ~
       (prejoin_upgrade_simulation.stderr | default(''))) | lower
      is not search(alt_apt_transient_error_pattern)
    )
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Record whether package changes are pending
  ansible.builtin.set_fact:
    prejoin_upgrade_pending: >-
      {{ prejoin_upgrade_simulation.rc != 0 or
         prejoin_upgrade_simulation.stdout is not search(
           '0 upgraded, 0 newly installed, 0 removed and 0 not upgraded'
         ) }}
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_simulation is defined

- name: Perform pending full ALT upgrade before first domain join
  ansible.builtin.command:
    argv: [apt-get, -y, dist-upgrade]
  register: prejoin_upgrade_dist_upgrade
  changed_when: prejoin_upgrade_pending | bool
  failed_when: false
  retries: "{{ alt_transient_attempts }}"
  delay: "{{ alt_transient_delay_seconds }}"
  until: >-
    prejoin_upgrade_dist_upgrade.rc == 0 or
    (
      ((prejoin_upgrade_dist_upgrade.stdout | default('')) ~ '\n' ~
       (prejoin_upgrade_dist_upgrade.stderr | default(''))) | lower
      is not search(alt_apt_transient_error_pattern)
    )
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_pending | default(false) | bool

- name: Stop before domain join when ALT upgrade cannot be completed
  ansible.builtin.set_fact:
    configure_phase_failure:
      code: upgrade_execution_failed
      class: fatal_invariant
      safe_message: ALT full upgrade could not be completed before domain join
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_pending | default(false) | bool
    - prejoin_upgrade_dist_upgrade.rc != 0

- name: Fail non-transient ALT upgrade before domain join
  ansible.builtin.fail:
    msg: >-
      ALT_PREFLIGHT_FAILURE:upgrade_execution_failed
      ALT full upgrade could not be completed before domain join
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_pending | default(false) | bool
    - prejoin_upgrade_dist_upgrade.rc != 0

- name: Record whether final system reboot is required after upgrade
  ansible.builtin.set_fact:
    prejoin_upgrade_reboot_required: >-
      {{ prejoin_upgrade_enabled | bool and
         not prejoin_upgrade_already_joined and
         prejoin_upgrade_dist_upgrade is defined and
         prejoin_upgrade_dist_upgrade is changed }}
