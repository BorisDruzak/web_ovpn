---
- name: Initialize deferred upgrade reboot decision
  ansible.builtin.set_fact:
    prejoin_upgrade_reboot_required: false

- name: Read current ALT authentication scheme before upgrade
  ansible.builtin.command:
    argv: [system-auth, status]
  register: prejoin_upgrade_auth_status
  changed_when: false
  failed_when: false

- name: Detect whether the workstation is already domain joined
  ansible.builtin.set_fact:
    prejoin_upgrade_already_joined: >-
      {{ (prejoin_upgrade_auth_status.stdout | lower).split() | length > 1 and
         (prejoin_upgrade_auth_status.stdout | lower).split() | first == 'ad' }}

- name: Inspect APT source files before first join
  ansible.builtin.find:
    paths: [/etc/apt, /etc/apt/sources.list.d]
    patterns: ['*.list']
    file_type: any
    follow: false
  register: prejoin_upgrade_sources
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Require regular root-owned APT source files
  ansible.builtin.assert:
    that:
      - item.isreg
      - not item.islnk
      - item.uid == 0
  loop: '{{ prejoin_upgrade_sources.files | default([]) }}'
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Select the approved p11 package mirror before first join
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '^([ \t]*rpm(-src)?[ \t]+\[p11\][ \t]+)http(s)?://ftp\.altlinux\.org/pub/distributions/ALTLinux([ \t]+p11/branch/(x86_64|x86_64-i586|i586|noarch)[ \t]+[^\r\n]+)$'
    replace: '\1https://download.basealt.ru/pub/distributions/ALTLinux\4'
    backup: false
  loop: '{{ prejoin_upgrade_sources.files | default([]) }}'
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Refresh ALT package metadata before first domain join
  tags: [alt_setup_download]
  ansible.builtin.command:
    argv: [apt-get, update]
  environment:
    LC_ALL: C
  register: prejoin_upgrade_metadata
  changed_when: false
  vars:
    alt_package_retry_output: >-
      {{ [prejoin_upgrade_metadata.stdout | default(''), prejoin_upgrade_metadata.stderr | default(''), prejoin_upgrade_metadata.msg | default('')] | join('\n') }}
  failed_when: >-
    prejoin_upgrade_metadata.rc != 0 or
    alt_package_retry_output | regex_search(alt_package_fatal_pattern) is not none or
    alt_package_retry_output | regex_search(alt_package_transient_pattern) is not none or
    'Some index files failed to download' in alt_package_retry_output
  until: >-
    prejoin_upgrade_metadata is succeeded or
    alt_package_retry_output | regex_search(alt_package_fatal_pattern) is not none or
    (alt_package_retry_output | regex_search(alt_package_lock_pattern) is none and
      (alt_package_retry_output | regex_search(alt_package_transient_pattern) is none or
       prejoin_upgrade_metadata.attempts | int >= alt_transient_retry_attempts | int))
  retries: "{{ alt_package_lock_retry_attempts | int - 1 }}"
  delay: "{{ alt_package_lock_retry_delay }}"
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Perform the full ALT upgrade before first domain join
  ansible.builtin.command:
    argv: [apt-get, -y, dist-upgrade]
  environment:
    LC_ALL: C
  register: prejoin_upgrade_dist_upgrade
  changed_when: true
  vars:
    alt_package_retry_output: >-
      {{ [prejoin_upgrade_dist_upgrade.stdout | default(''), prejoin_upgrade_dist_upgrade.stderr | default(''), prejoin_upgrade_dist_upgrade.msg | default('')] | join('\n') }}
  tags: [alt_setup_transaction]
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined

- name: Request a deferred reboot after the full pre-join ALT upgrade
  ansible.builtin.set_fact:
    prejoin_upgrade_reboot_required: true
  when:
    - prejoin_upgrade_enabled | bool
    - not prejoin_upgrade_already_joined
    - prejoin_upgrade_dist_upgrade is defined
    - prejoin_upgrade_dist_upgrade is changed
