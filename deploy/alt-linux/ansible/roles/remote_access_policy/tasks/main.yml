---
- name: Require the internally claimed complete-workstation system phase
  ansible.builtin.assert:
    that:
      - alt_setup_workflow_context is defined
      - alt_setup_workflow_context is mapping
      - alt_setup_workflow_context.kind == 'complete_workstation'
      - alt_setup_workflow_context.phase == 'system'
      - alt_setup_vnc_policy_evidence is defined
      - alt_setup_vnc_policy_evidence is mapping
      - alt_setup_vnc_policy_evidence.schema_version == 1
      - alt_setup_vnc_policy_evidence.listener_authenticated is boolean
      - alt_setup_workflow_context.machine_uuid == alt_setup_vnc_policy_evidence.observation.machine_uuid
      - alt_setup_workflow_context.source_sha256 == alt_setup_vnc_policy_evidence.observation.source_sha256
      - alt_setup_workflow_context.policy_sha256 == alt_setup_vnc_policy_evidence.observation.policy_sha256
    fail_msg: The claimed direct VNC policy context is unavailable
  no_log: true

- name: Inspect fixed policy helper parent directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: [/usr, /usr/local, /usr/local/libexec]
  register: alt_vnc_policy_parents
  no_log: true

- name: Require protected policy helper parent directories
  ansible.builtin.assert:
    that:
      - item.stat.exists and item.stat.isdir and not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.mode[-2] in ['0', '1', '4', '5']
      - item.stat.mode[-1] in ['0', '1', '4', '5']
    fail_msg: The direct VNC policy helper directory is unsafe
  loop: "{{ alt_vnc_policy_parents.results }}"
  no_log: true

- name: Inspect the fixed policy helper before installation
  ansible.builtin.stat:
    path: /usr/local/libexec/alt-vnc-access-policy
    follow: false
    checksum_algorithm: sha256
  register: alt_vnc_policy_helper_before
  no_log: true

- name: Reject an unowned policy helper collision
  ansible.builtin.assert:
    that:
      - >-
        not alt_vnc_policy_helper_before.stat.exists or
        (alt_vnc_policy_helper_before.stat.isreg and
         not alt_vnc_policy_helper_before.stat.islnk and
         alt_vnc_policy_helper_before.stat.uid == 0 and
         alt_vnc_policy_helper_before.stat.mode == '0700' and
         alt_vnc_policy_helper_before.stat.checksum == alt_setup_vnc_policy_evidence.helper_sha256)
    fail_msg: The direct VNC policy helper ownership is unverified
  no_log: true

- name: Install the fixed private direct VNC policy helper
  ansible.builtin.template:
    src: alt-vnc-access-policy.py.j2
    dest: /usr/local/libexec/alt-vnc-access-policy
    owner: root
    group: root
    mode: '0700'
  no_log: true
  diff: false

- name: Apply only the exact freshly observed and claimed direct policy
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/local/libexec/alt-vnc-access-policy, --apply]
    stdin: >-
      {{ {'schema_version': 1,
          'helper_sha256': alt_setup_vnc_policy_evidence.helper_sha256,
          'machine_uuid': alt_setup_vnc_policy_evidence.observation.machine_uuid,
          'hostname': alt_setup_vnc_policy_evidence.observation.hostname,
          'source_sha256': alt_setup_vnc_policy_evidence.observation.source_sha256,
          'expected_snapshot_sha256': alt_setup_vnc_policy_evidence.observation.snapshot_sha256,
          'listener_authenticated': alt_setup_vnc_policy_evidence.listener_authenticated,
          'context': alt_setup_workflow_context} | to_json }}
    stdin_add_newline: false
  register: alt_vnc_policy_apply
  changed_when: alt_vnc_policy_apply.rc == 0 and (alt_vnc_policy_apply.stdout | from_json).result.changed
  failed_when: false
  no_log: true
  diff: false

- name: Require verified direct policy preparation
  ansible.builtin.assert:
    that:
      - alt_vnc_policy_apply.rc == 0
      - (alt_vnc_policy_apply.stdout | from_json).status == 'ok'
      - (alt_vnc_policy_apply.stdout | from_json).result.ready is sameas true
      - (alt_vnc_policy_apply.stdout | from_json).result.policy_sha256 == alt_setup_workflow_context.policy_sha256
    fail_msg: Direct VNC policy preparation requires review
  no_log: true
