---
- name: Require the approved staging component
  ansible.builtin.assert:
    that:
      - setup_component_id | default('') == 'software.endpoint_agent'
      - machine_uuid is match('^[0-9a-f-]{36}$')
      - >-
        (setup_inventory_installation_id | default('')) is match(
          '^inventory-[0-9a-f-]{36}-' ~ machine_uuid ~ '-[0-9a-f]{32}$')
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_component_required

- name: Check the protected staging configuration directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop:
    - path: /etc/endpoint-agent
      modes: ["0755"]
    - path: /etc/systemd/system/endpoint-agent.service.d
      modes: ["0700", "0705", "0750", "0755"]
  register: endpoint_native_config_dirs
  tags: [alt_setup_preflight]

- name: Require root-owned staging configuration directories
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid == 0 and item.stat.gid == 0
      - item.stat.mode in item.item.modes
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_staging_prerequisites_missing
  loop: "{{ endpoint_native_config_dirs.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  tags: [alt_setup_preflight]

- name: Read protected native staging prerequisites
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  loop:
    - {path: /etc/endpoint-agent/ca.crt, mode: "0600"}
    - {path: /etc/systemd/system/endpoint-agent.service.d/staging.conf, mode: "0644"}
  register: endpoint_native_prerequisites

- name: Require root-owned staging prerequisites
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid == 0 and item.stat.gid == 0
      - item.stat.mode == item.item.mode
      - item.stat.nlink == 1
      - 0 < item.stat.size <= 65536
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_staging_prerequisites_missing
  loop: "{{ endpoint_native_prerequisites.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Read the protected staging scope
  ansible.builtin.slurp:
    src: /etc/systemd/system/endpoint-agent.service.d/staging.conf
  register: endpoint_native_staging_scope
  no_log: true

- name: Require the exact staging origin and approval markers
  vars:
    staging_dropin: |
      [Service]
      Environment=ENDPOINT_AGENT_DEPLOYMENT_ENVIRONMENT=staging
      Environment=CANARY_ENVIRONMENT=staging
      Environment=CANARY_APPROVED=true
      Environment=ENDPOINT_AGENT_ORIGIN=https://endpoint-staging.sosnadmin.local
  ansible.builtin.assert:
    that:
      - (endpoint_native_staging_scope.content | b64decode) == staging_dropin
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_staging_scope_invalid
  no_log: true

- name: Inspect the existing native configuration slot
  ansible.builtin.stat:
    path: /etc/endpoint-agent/config.yaml
    follow: false
    get_checksum: false
  register: endpoint_native_config_slot

- name: Check an existing configuration before issuing Endpoint authority
  ansible.builtin.include_tasks: verify_config.yml
  when: endpoint_native_config_slot.stat.exists

- name: Inspect retained Endpoint state directories without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop:
    - /var/lib/endpoint-agent
    - /var/lib/endpoint-agent-installation
  register: endpoint_native_state_dirs
  tags: [alt_setup_preflight]

- name: Require real directories for any retained Endpoint state
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isdir | default(false))
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_retained_identity_requires_review
  loop: "{{ endpoint_native_state_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [alt_setup_preflight]

- name: Check for a retained device identity or unfinished enrollment
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop:
    - /var/lib/endpoint-agent/device-credential
    - /var/lib/endpoint-agent/enrollment-identity.json
    - /var/lib/endpoint-agent-installation/fresh-enrollment-private.json
    - /var/lib/endpoint-agent-installation/state.json
  register: endpoint_native_retained_state
  tags: [alt_setup_preflight]

- name: Require an unused Endpoint identity before a directed installation
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - not (item.stat.islnk | default(false))
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_retained_identity_requires_review
  loop: "{{ endpoint_native_retained_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [alt_setup_preflight]

- name: Inspect both Endpoint RPM slots
  ansible.builtin.command:
    argv: [rpm, -q, "{{ item.package_name }}"]
  loop: "{{ software_catalog.endpoint_agent_native.packages }}"
  register: endpoint_native_existing
  changed_when: false
  failed_when: endpoint_native_existing.rc not in [0, 1]

- name: Require fresh slots for the install action
  ansible.builtin.assert:
    that:
      - endpoint_native_existing.results | map(attribute='rc') | unique | list == [1]
    fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_existing_installation_requires_review

- name: Install the exact published native kit
  vars:
    endpoint_native_kit_dir: "{{ endpoint_native_tmp.path }}/endpoint-alt-pilot-3.2.183-1"
    endpoint_native_core_rpm: "{{ endpoint_native_kit_dir }}/endpoint-agent-3.2.183-alt6.x86_64.rpm"
    endpoint_native_sensor_rpm: "{{ endpoint_native_kit_dir }}/endpoint-agent-user-sensor-3.2.183-alt6.x86_64.rpm"
  block:
    - name: Create private staging directory for the signed kit
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: endpoint-native-kit-
      register: endpoint_native_tmp

    - name: Copy the pinned native kit
      ansible.builtin.copy:
        src: "{{ software_catalog.endpoint_agent_native.artifact_path }}"
        dest: "{{ endpoint_native_tmp.path }}/kit.tar.gz"
        owner: root
        group: root
        mode: "0600"

    - name: Hash the copied native kit
      ansible.builtin.stat:
        path: "{{ endpoint_native_tmp.path }}/kit.tar.gz"
        follow: false
        checksum_algorithm: sha256
      register: endpoint_native_copy

    - name: Require the exact signed archive bytes before extraction
      ansible.builtin.assert:
        that:
          - endpoint_native_copy.stat.isreg
          - not endpoint_native_copy.stat.islnk
          - endpoint_native_copy.stat.checksum == software_catalog.endpoint_agent_native.sha256
        fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_kit_invalid

    - name: Extract the verified archive into private staging
      ansible.builtin.unarchive:
        src: "{{ endpoint_native_tmp.path }}/kit.tar.gz"
        dest: "{{ endpoint_native_tmp.path }}"
        remote_src: true

    - name: Test the published RPM pair on the selected workstation
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - /usr/bin/timeout
          - --kill-after=5s
          - 60s
          - /usr/bin/rpm
          - -U
          - --oldpackage
          - --test
          - "{{ endpoint_native_core_rpm }}"
          - "{{ endpoint_native_sensor_rpm }}"
      register: endpoint_native_rpm_preflight
      changed_when: false
      failed_when: false
      no_log: true
      tags: [alt_setup_preflight]

    - name: Require the RPM pair to be compatible before requesting assignment
      ansible.builtin.assert:
        that:
          - endpoint_native_rpm_preflight.rc == 0
        fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_rpm_preflight_failed
      tags: [alt_setup_preflight, alt_setup_endpoint_rpm_preflight]

    - name: Create a private directory for the verified runtime probe
      ansible.builtin.file:
        path: "{{ endpoint_native_tmp.path }}/probe"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Extract only the approved runtime from the verified core RPM
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os
            from pathlib import Path
            import subprocess
            import sys
            import tempfile

            rpm, destination = map(Path, sys.argv[1:])
            runtime = Path("opt/endpoint-agent/versions/3.2.183/endpoint-agent")
            with tempfile.TemporaryFile(dir=destination) as payload:
                subprocess.run(["/usr/bin/rpm2cpio", str(rpm)], stdout=payload, check=True)
                payload.seek(0)
                subprocess.run([
                    "/usr/bin/cpio", "--quiet", "--extract", "--make-directories",
                    "--no-absolute-filenames", "--no-preserve-owner",
                    f"./{runtime}/*", f"{runtime}/*",
                ], stdin=payload, cwd=destination, check=True)
            binary = destination / runtime / "endpoint-agent"
            if binary.is_symlink() or not binary.is_file() or not os.access(binary, os.X_OK):
                raise SystemExit(1)
          - "{{ endpoint_native_core_rpm }}"
          - "{{ endpoint_native_tmp.path }}/probe"
      changed_when: false
      no_log: true

    - name: Read the fingerprint with the signed runtime
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - /usr/bin/timeout
          - --kill-after=5s
          - 30s
          - "{{ endpoint_native_tmp.path }}/probe/opt/endpoint-agent/versions/3.2.183/endpoint-agent/endpoint-agent"
          - --print-hardware-fingerprint
      register: endpoint_native_fingerprint
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require a canonical fingerprint from the selected workstation
      ansible.builtin.assert:
        that:
          - endpoint_native_fingerprint.rc == 0
          - endpoint_native_fingerprint.stdout is match('^sha256:[0-9a-f]{64}$')
        fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_fingerprint_unavailable
      tags: [alt_setup_preflight]

    - name: Issue the installation assignment on the staging controller
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - /opt/alt-deploy-endpoint-sdk/bin/python
          - -I
          - /opt/alt-deploy-control/alt_deploy/endpoint_assignment_issuer.py
        stdin: >-
          {{ {'installation_id': setup_inventory_installation_id,
              'machine_uuid': machine_uuid,
              'hardware_fingerprint': endpoint_native_fingerprint.stdout} | to_json }}
      delegate_to: localhost
      become: false
      register: endpoint_native_assignment
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require a live Endpoint installation assignment
      ansible.builtin.assert:
        that:
          - endpoint_native_assignment.rc == 0
        fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_assignment_unavailable
      tags: [alt_setup_preflight]

    - name: Prepare native configuration only in a fresh slot
      ansible.builtin.copy:
        dest: /etc/endpoint-agent/config.yaml
        owner: root
        group: root
        mode: "0600"
        force: false
        content: |
          schema_version: 1
          gateway:
            endpoint: "https://endpoint-staging.sosnadmin.local"
            ca_file: "/etc/endpoint-agent/ca.crt"
          provisioning:
            installation_id: "{{ setup_inventory_installation_id }}"
            systemd_claim_credential_name: "endpoint-enrollment-claim"
            permanent_credential_file: "/var/lib/endpoint-agent/device-credential"
          runtime:
            data_dir: "/var/lib/endpoint-agent"
            log_dir: "/var/log/endpoint-agent"
            install_root: "/opt/endpoint-agent"
          context_profiles:
            scheduled: [baseline_v1, health_v1, network_v1]
            diagnostic_manual_only: true
      when: not endpoint_native_config_slot.stat.exists
      no_log: true

    - name: Verify the current native configuration before install
      ansible.builtin.include_tasks: verify_config.yml

    - name: Run the existing Endpoint native coordinator
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - "{{ endpoint_native_kit_dir }}/endpoint-agent-setup"
          - install
          - --core-rpm
          - "{{ endpoint_native_core_rpm }}"
          - --user-sensor-rpm
          - "{{ endpoint_native_sensor_rpm }}"
          - --public-key
          - "{{ endpoint_native_kit_dir }}/endpoint-rpm-release.asc"
      environment:
        ENDPOINT_AGENT_DEPLOYMENT_ENVIRONMENT: staging
        CANARY_ENVIRONMENT: staging
        CANARY_APPROVED: "true"
        ENDPOINT_AGENT_ORIGIN: https://endpoint-staging.sosnadmin.local
      register: endpoint_native_result
      changed_when: endpoint_native_result.rc == 0
      failed_when: false
      no_log: true

    - name: Require confirmed native installation before reporting a local result
      ansible.builtin.assert:
        that:
          - endpoint_native_result.rc == 0
        fail_msg: ALT_PREFLIGHT_FAILURE:endpoint_native_result_requires_review

  always:
    - name: Remove only this job's private kit staging directory
      ansible.builtin.file:
        path: "{{ endpoint_native_tmp.path }}"
        state: absent
      when: endpoint_native_tmp.path is defined
