---
- name: Require the completed component preflight and fixed selection
  ansible.builtin.assert:
    that:
      - configure_component_preflight_passed | default(false) | bool
      - selected_software_components == setup_selected_catalog.selected_software_components
      - software_component_role_map == setup_selected_catalog.software_component_role_map
    fail_msg: Software component selection is invalid

- name: Set configure phase to software components
  ansible.builtin.set_fact:
    configure_result: "{{ configure_result | combine({'phase': 'components'}) }}"
  when: selected_software_components | length > 0

- name: Run selected approved software roles
  ansible.builtin.include_role:
    name: "{{ software_component_role_map[software_component] }}"
  loop: "{{ selected_software_components }}"
  loop_control:
    loop_var: software_component

- name: Return to the domain verification phase after successful software roles
  ansible.builtin.set_fact:
    configure_result: "{{ configure_result | combine({'phase': 'domain_core_verify'}) }}"
  when: selected_software_components | length > 0
