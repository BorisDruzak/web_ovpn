---
- name: Validate requested hostname mode
  ansible.builtin.assert:
    that: hostname_mode in ['verify', 'change_confirmed']
    fail_msg: ALT_PREFLIGHT_FAILURE:hostname_mismatch unsupported hostname mode

- name: Read current static hostname
  ansible.builtin.command:
    argv: [hostnamectl, --static]
  register: workstation_identity_before
  changed_when: false

- name: Define accepted static hostname values for the approved workstation
  ansible.builtin.set_fact:
    workstation_identity_accepted_static_hostnames:
      - "{{ final_hostname | lower }}"
      - "{{ final_hostname | lower }}.{{ ad_domain | lower }}"

- name: Verify approved static hostname without changing it
  ansible.builtin.assert:
    that: >-
      workstation_identity_before.stdout | trim | lower
      in workstation_identity_accepted_static_hostnames
    fail_msg: ALT_PREFLIGHT_FAILURE:hostname_mismatch static hostname does not match approved request
  when: hostname_mode == 'verify'

- name: Apply explicitly confirmed static hostname
  ansible.builtin.hostname:
    name: "{{ final_hostname }}"
    use: systemd
  when: hostname_mode == 'change_confirmed'

- name: Read resulting static hostname
  ansible.builtin.command:
    argv: [hostnamectl, --static]
  register: workstation_identity_after
  changed_when: false

- name: Verify resulting static hostname
  ansible.builtin.assert:
    that: >-
      workstation_identity_after.stdout | trim | lower
      in workstation_identity_accepted_static_hostnames
    fail_msg: ALT_PREFLIGHT_FAILURE:hostname_mismatch static hostname does not match approved request
